spring.config.import=optional:classpath:secret.properties
spring.application.name=DevTrack
# Database Configuration
spring.datasource.url=${url}

spring.datasource.username=${db.username}
spring.datasource.password=${db.password}

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update

# Show SQL Queries
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

# Set SMTP values and app.auth.reset-email-enabled=true to send reset emails.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${mail.username}
spring.mail.password=${mail.password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.email-verification.expiration=86400
app.base-url=http://localhost:8080

